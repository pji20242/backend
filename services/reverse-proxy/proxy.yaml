apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    protocol: mqtt
  name: nginx
  namespace: pji3
spec:
  selector: 
    matchLabels:
      app: nginx
  replicas: 1
  template:
    metadata:
      labels:
        app: nginx
        protocol: mqtt
    spec:
      containers:
        - image: docker.io/nginx:1.26.2
          name: nginx
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 1883
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2
              memory: 512Mi
          volumeMounts:
            - name: nginx-nginx-conf
              mountPath: /etc/nginx/
      restartPolicy: Always
      volumes:
      - name: nginx-nginx-conf
        configMap:
          name: nginx-nginx-conf
          items:
          - path: "nginx.conf"
            key: nginx.conf

