persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
listener 1883
listener 8080
protocol websockets

# Habilitar autenticação
auth_plugin /mosquitto-auth-plug/auth-plug.so

# Configurações do PostgreSQL
auth_opt_backends postgres
auth_opt_host dbmqtt
auth_opt_port 5432
auth_opt_dbname mqtt
auth_opt_user postgres
auth_opt_pass postgres
auth_opt_userquery SELECT pw FROM mqttusers WHERE username = $1 limit 1
auth_opt_superquery SELECT COALESCE(COUNT(*),0) FROM mqttusers WHERE username = $1 AND mosquitto_super = TRUE
auth_opt_aclquery SELECT topic FROM mqttacls WHERE (username = $1) AND (rw & $2) > 0
auth_opt_anonusername AnonymouS
