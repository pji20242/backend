services:
  mqtt-broker:
    container_name: mqtt-broker
    build:
      context: .
      dockerfile: ./mqtt-broker/Dockerfile
    restart: always
    volumes:
      - ./mqtt-broker/mosquitto.cfg:/mosquitto/config/mosquitto.conf
      - ./mqtt-broker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
# =======================================================================================================
  dbmqtt: 
    image: postgres:13
    container_name: dbmqtt
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mqtt
    ports:
      - "5432:5432"
    volumes:
      - ./databaseMqtt/setup.sql:/docker-entrypoint-initdb.d/init.sql

# =======================================================================================================
  database:
    environment:
      MYSQL_DATABASE: pjiot
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/secret-db
    image: mysql:9.2.0
    restart: always
    secrets:
      - secret-db
    volumes:
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

# ========================================================================================================
  connector:
    build:
      context: .
      dockerfile: ./connector/Dockerfile
    volumes:
      - ./connector/connector.out:/connector.out:rw
    depends_on:
      - mqtt-broker
    restart: always
    env_file:
      - ./connector/env/.env

# ========================================================================================================
  apiconnector:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    volumes:
      - ./api/apiconnector.out:/apiconnector.out:rw
    restart: always
    env_file:
      - ./api/env/.env

# ========================================================================================================
  reverse-proxy:
    depends_on:
      - mqtt-broker
      - apiconnector
      - frontend
    image: nginx
    ports:
      - 80:80
      - 443:443
      - 1883:1883
    restart: always
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/vm0.pji3.sj.ifsc.edu.br/fullchain.pem:/etc/nginx/fullchain.pem:ro
      - /etc/letsencrypt/live/vm0.pji3.sj.ifsc.edu.br/privkey.pem:/etc/nginx/privkey.pem:ro

# ========================================================================================================
  frontend:
    image: node
    command: sh -c "cd /app && npm install && npm install -g vite && npm run build && vite preview --host 0.0.0.0"
    restart: always
    volumes:
      - ./frontend:/app
secrets:
  secret-db:
    file: ./database/.secret-db

volumes:
  influxdb_data:
  mysql_data:
